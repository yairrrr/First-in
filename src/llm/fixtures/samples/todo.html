<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Todo App</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .app-container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #007bff;
        }

        button#add-btn {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button#add-btn:hover {
            background-color: #0056b3;
        }

        .stats {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
            text-align: center;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-item:hover {
            background-color: #f9f9f9;
        }

        .todo-text {
            flex: 1;
            margin-right: 10px;
            cursor: pointer;
        }

        .todo-text.completed {
            text-decoration: line-through;
            color: #aaa;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .delete-btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>My Tasks</h1>
    <div class="input-group">
        <input type="text" id="todo-input" placeholder="Add a new task..." />
        <button id="add-btn">Add</button>
    </div>
    <div class="stats" id="counter">0 items left</div>
    <ul id="todo-list"></ul>
</div>

<script>
    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');
    const counter = document.getElementById('counter');

    function updateCounter() {
        const total = todoList.querySelectorAll('.todo-item').length;
        const completed = todoList.querySelectorAll('.completed').length;
        const remaining = total - completed;
        counter.innerText = `${remaining} item${remaining !== 1 && remaining !== 0 ? 's' : ''} left`;
    }

    function createTodo() {
        const text = input.value.trim();
        if (text === "") return;

        const li = document.createElement('li');
        li.className = 'todo-item';
        
        li.innerHTML = `
            <span class="todo-text">${text}</span>
            <div class="actions">
                <button class="delete-btn">Delete</button>
            </div>
        `;

        const textSpan = li.querySelector('.todo-text');
        const deleteBtn = li.querySelector('.delete-btn');

        // Toggle completion
        textSpan.addEventListener('click', () => {
            textSpan.classList.toggle('completed');
            updateCounter();
        });

        // Delete functionality
        deleteBtn.addEventListener('click', () => {
            li.remove();
            updateCounter();
        });

        todoList.appendChild(li);
        input.value = "";
        updateCounter();
    }

    addBtn.addEventListener('click', createTodo);

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            createTodo();
        }
    });

    // Initial call
    updateCounter();
</script>

</body>
</html>
